<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Site para minha mãe</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background-color:  #8c00ff46;
    }
    header {
      background-color: #d31cf8;
      padding: 20px;
      text-align: center;
      color: rgb(8, 3, 3);
    }
    header h1 {
      margin: 0;
    }
    .sobre {
      padding: 30px;
      text-align: center;
    }
    .sobre img {
      max-width: 200px;
      border-radius: 50%;
      margin: 20px 0;
    }
    .galeria {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      padding: 20px;
    }
    .galeria img {
      width: 200px;
      height: 150px;
      object-fit: cover;
      border-radius: 10px;
    }
    footer {
      background-color:  #d31cf8;;
      text-align: center;
      padding: 15px;
      color: rgb(0, 0, 0);
      position: relative;
      bottom: 0;
      width: 100%;
    }
  </style>
</head>
<body>
  <header>
    <h1>Site da Mamãe 💖</h1>
    <p>Com todo carinho para você!</p>
  </header>

  <section class="sobre">
    <h2>Sobre minha mãe </h2>
    <img src="FOTO 5 (1).jpg" alt="foto2">
    <p>Essa é a minha mãe, uma mulher incrível, forte e cheia de amor! Fiz este site para mostrar o quanto ela é especial para mim.</p>
  </section>

  <section class="galeria">
    <img src="FOTO 5 (3).jpg" alt="Foto 1">
    <img src="FOTO 5 (4).jpg" alt="Foto 2">
    <img src="FOTO 5 (5).jpg" alt="Foto 3">
    <img src="foto 7.jpg" alt="Foto 4">
  </section>

  <footer>
    <p>Feito com amor 💗 por [NICOLLAS] - 2025</p>
  </footer>
</body>

</html>
